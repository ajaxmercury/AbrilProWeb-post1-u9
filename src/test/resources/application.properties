# ==============================================================================
# CONFIGURACION DE PRUEBAS AUTOMATIZADAS - H2 IN-MEMORY (seguridad-web)
# ==============================================================================
spring.application.name=seguridad-web-test

# Base de datos en memoria H2 emulando MySQL
spring.datasource.url=jdbc:h2:mem:seguridad_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL para pruebas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Clave secreta JWT para pruebas (256 bits)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Thymeleaf en tests
spring.thymeleaf.cache=false
