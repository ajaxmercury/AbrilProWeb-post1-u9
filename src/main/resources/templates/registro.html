<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Seguridad Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <h2 class="h4 text-primary fw-bold">Crear Cuenta</h2>
                        <p class="text-muted small">Registro con asignación predeterminada de ROLE_USER</p>
                    </div>

                    <div th:if="${errorGlobal}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                        <span th:text="${errorGlobal}">Error al procesar el registro.</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Formulario de Registro con Proteccion CSRF Activa -->
                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        <!-- Input CSRF explicito -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label small fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="Ej: Carlos Rodriguez" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="correo@ejemplo.com" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenia" class="form-label small fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenia" th:field="*{contrasenia}"
                                   th:classappend="${#fields.hasErrors('contrasenia')} ? 'is-invalid' : ''"
                                   placeholder="Mínimo 6 caracteres" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contrasenia')}" th:errors="*{contrasenia}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarContrasenia" class="form-label small fw-semibold">Confirmar Contraseña</label>
                            <input type="password" class="form-control" id="confirmarContrasenia" th:field="*{confirmarContrasenia}"
                                   th:classappend="${#fields.hasErrors('confirmarContrasenia')} ? 'is-invalid' : ''"
                                   placeholder="Repita la contraseña" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarContrasenia')}" th:errors="*{confirmarContrasenia}"></div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary fw-semibold">Registrarse</button>
                        </div>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="small text-muted mb-1">¿Ya tienes cuenta?</p>
                        <a th:href="@{/login}" class="text-decoration-none fw-semibold">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
