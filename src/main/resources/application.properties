# ==============================================================================
# CONFIGURACION PRINCIPAL DE LA APLICACION - SPRING BOOT 3.2.x (seguridad-web)
# ==============================================================================
spring.application.name=seguridad-web
server.port=8080

# ==============================================================================
# PERSISTENCIA Y BASE DE DATOS MYSQL (PRODUCCION / DESARROLLO)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# CONFIGURACION DEL MOTOR DE PLANTILLAS THYMELEAF
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==============================================================================
# PROPIEDADES DE SEGURIDAD JWT (API REST STATELESS)
# Clave HMAC-SHA de al menos 256 bits (32 bytes) codificada o cadena de alta entropia
# ==============================================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiracion: 3600000 ms = 1 hora
app.jwt.expiration-ms=3600000

# ==============================================================================
# GESTION DE SESIONES WEB TRADICIONALES
# ==============================================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
